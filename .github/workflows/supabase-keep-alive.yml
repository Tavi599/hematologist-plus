name: Supabase keep-alive

# Free Supabase projects are paused after 7 days without activity.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query a reference table
        run: |
          set -a; . ./.env; set +a
          # A real REST query hits Postgres, which is what counts as project activity.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$VITE_SUPABASE_URL/rest/v1/classification_systems?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
