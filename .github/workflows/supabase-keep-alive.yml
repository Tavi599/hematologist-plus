name: Supabase keep-alive

# Free Supabase projects are paused after 7 days without activity.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase API
        run: |
          set -a; . ./.env; set +a
          # TODO(stage 2): query a real reference table instead, so the database itself is hit.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$VITE_SUPABASE_URL/auth/v1/settings" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
